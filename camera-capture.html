<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GS Tech">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/favicon-light-64.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="/icons/favicon-dark-64.png" media="(prefers-color-scheme: dark)">
<title>Camera</title>
<style>
  :root{
    --black:#111; --gold:#C9A84C; --gold-lt:#E2C97E; --gold-dk:#8C6F2A;
    --white:#fff; --off:#F7F6F3; --gray:#6B6B6B; --border:#E0D9CC; --red:#c0392b; --green:#27ae60;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; font-family: 'Inter', -apple-system, sans-serif;
    background: #000; color: var(--white);
    /* 100dvh (altura dinamica real del navegador movil), no 100vh --
       100vh en Chrome/Safari movil se calcula con la barra de
       direcciones COLAPSADA (la version mas grande posible), pero la
       pagina carga con la barra VISIBLE (mas chica) -- el resultado es
       que el documento queda MAS ALTO que lo que se ve al inicio, se
       vuelve scrolleable, y al hacer scroll se revela ese sobrante de
       abajo. Con height fijo (no min-height) + overflow:hidden, la
       pagina nunca excede la pantalla ni se puede hacer scroll -- es
       una camara de pantalla completa, nunca deberia necesitar scroll. */
    height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; background: rgba(0,0,0,.65); position: relative; z-index: 5;
    flex-shrink: 0;
  }
  .top-bar h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .close-btn {
    background: none; border: none; color: var(--white); font-size: 20px; cursor: pointer;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  }
  .camera-wrap {
    /* min-height: 0 (no "auto", el default de flex) es lo que de
       verdad arregla esto -- sin esto, un <video> cuya resolucion real
       de camara sea mas alta que el espacio disponible puede forzar a
       este contenedor a crecer MAS ALLA de lo que flex:1 le queria dar,
       empujando bottom-panel fuera de la pantalla. */
    flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center;
    background: #1a1a1a; overflow: hidden;
  }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .camera-error { color: var(--gray); font-size: 13px; text-align: center; padding: 24px; display: none; }
  .counter-pill {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.55); border-radius: 20px; padding: 6px 14px;
    font-size: 12px; font-weight: 600; letter-spacing: .02em;
  }
  .bottom-panel { background: var(--black); padding: 14px 16px 20px; flex-shrink: 0; }
  .thumb-row {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; min-height: 60px;
  }
  .thumb {
    width: 52px; height: 52px; border-radius: 6px; flex-shrink: 0; position: relative;
    background: #333; overflow: hidden; border: 1px solid rgba(255,255,255,.15); cursor: default;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-status {
    position: absolute; bottom: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700;
  }
  .thumb-status.uploading { background: var(--gold); color: var(--black); }
  .thumb-status.waiting { background: #555; color: #fff; }
  .thumb-status.done { background: var(--green); color: #fff; }
  .thumb-status.failed { background: var(--red); color: #fff; cursor: pointer; }
  .controls { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .spacer-btn { width: 64px; }
  .shutter-btn {
    width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--white);
    background: var(--white); cursor: pointer; flex-shrink: 0; position: relative;
  }
  .shutter-btn:active { transform: scale(.94); }
  .shutter-btn:disabled { opacity: .3; cursor: not-allowed; }
  .done-btn {
    background: var(--gold); color: var(--black); border: none; border-radius: 24px;
    padding: 12px 22px; font-size: 13px; font-weight: 700; cursor: pointer; width: 64px;
  }
  .status-line {
    text-align: center; font-size: 11px; color: var(--gray); margin-top: 10px; min-height: 14px;
  }
  .status-line.warn { color: var(--gold-lt); }
</style>
</head>
<body>

  <div class="top-bar">
    <h1 id="page-title">Order</h1>
    <button class="close-btn" id="close-btn" title="Close">✕</button>
  </div>

  <div class="camera-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="camera-error" id="camera-error">
      Could not open the camera — check that you gave permission, then reload this page.
    </div>
    <div class="counter-pill" id="counter-pill">0 / 10 photos</div>
  </div>

  <div class="bottom-panel">
    <div class="thumb-row" id="thumb-row"></div>
    <div class="controls">
      <div class="spacer-btn"></div>
      <button class="shutter-btn" id="shutter-btn"></button>
      <button class="done-btn" id="done-btn">Done</button>
    </div>
    <div class="status-line" id="status-line"></div>
  </div>

<script src="shared.js"></script>
<script src="i18n.js"></script>
<script src="https://cdn.jsdelivr.net/gh/tunena1023/gsocd-shared@71670c4e06fbb09c07fe248cf4a5a89c3399b384/camera-queue/camera-queue.js"></script>
<script>
  const tech = GS.requireSession(); // cualquier rol -- Employee y Supervisor entran ambos aqui

  const params = new URLSearchParams(location.search);
  const context = params.get('context');       // 'order-photo' | 'recurring-photo' | 'service-photo'
  const orderId = params.get('orderId');
  const recurringServiceId = params.get('recurringServiceId');
  const visitDate = params.get('visitDate');
  const serviceName = params.get('serviceName'); // solo para context='service-photo'
  const label = params.get('label');            // texto para el titulo, opcional
  const returnTo = params.get('return') || 'employee.html';
  const requireAtLeastOne = params.get('requireAtLeastOne') === '1';
  const completeAfter = params.get('completeAfter') === '1';
  /* "Assign by service" -- version por-servicio de completeAfter,
     mismo mecanismo (foto obligatoria, redirige con el dato en la
     URL para que employee.html complete solo al cargar), pero con
     categoria+servicio en vez de solo el orderId. */
  const completeServiceAfter = params.get('completeServiceAfter') === '1';
  const serviceCategory = params.get('serviceCategory');
  const MAX_PHOTOS = 10;

  document.getElementById('page-title').textContent = label || (orderId ? ('Order ' + orderId) : 'Camera');
  document.getElementById('close-btn').addEventListener('click', goBack);

  function goBack() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    location.href = returnTo;
  }
  function finish() {
    if (requireAtLeastOne && count === 0) {
      const statusLine = document.getElementById('status-line');
      statusLine.textContent = 'Take at least 1 photo before finishing.';
      statusLine.className = 'status-line warn';
      return;
    }
    if (stream) stream.getTracks().forEach(t => t.stop());
    const sep = returnTo.indexOf('?') === -1 ? '?' : '&';
    if (completeServiceAfter && orderId && serviceName) {
      location.href = returnTo + sep + 'completeServiceOrder=' + encodeURIComponent(orderId) +
        '&completeServiceCategory=' + encodeURIComponent(serviceCategory || '') +
        '&completeServiceName=' + encodeURIComponent(serviceName);
    } else if (completeAfter && orderId) {
      /* completeDay (26/09/2026): "Mark my part done" de ese dia. */
      const completeDay = params.get('completeDay');
      location.href = returnTo + sep + 'completeOrder=' + encodeURIComponent(orderId) +
        (completeDay ? '&completeDay=' + encodeURIComponent(completeDay) : '');
    } else {
      location.href = returnTo;
    }
  }

  /* Mismo mecanismo que ya usaba employee.html/supervisor.html --
     nunca bloquea la subida si falla o la niegan. */
  function getLocationSafe() {
    return new Promise(resolve => {
      if (!navigator.geolocation) { resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
        () => resolve(null),
        { timeout: 8000, maximumAge: 0 }
      );
    });
  }

  /* La cola es la MISMA pieza compartida para cualquier app que la
     use -- lo unico que cambia por pagina es dbName (para que cada
     app tenga su propio cajon en IndexedDB) y uploadFn (como se
     arma el body real para el endpoint que le toca). El endpoint/
     body si varia por contexto (order-photo vs recurring-photo),
     eso se decide en capture() mas abajo. */
  GSCameraQueue.init({
    dbName: 'gs-tech-camera-queue',
    maxAttempts: 10,
    retryIntervalMs: 20000,
    uploadFn: async function (item) {
      return GS.api(item.endpoint, { body: item.body });
    },
    onChange: onQueueChange
  });

  let stream = null;
  let count = 0;
  const thumbById = {}; // dbId (de la cola) -> { el, statusEl }

  async function initCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      document.getElementById('video').srcObject = stream;
    } catch (e) {
      document.getElementById('video').style.display = 'none';
      document.getElementById('camera-error').style.display = 'block';
    }
  }
  initCamera();

  function captureFrame() {
    const video = document.getElementById('video');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', 0.85);
  }

  function addThumb(imageBase64) {
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const img = document.createElement('img');
    img.src = imageBase64;
    thumb.appendChild(img);
    const status = document.createElement('div');
    status.className = 'thumb-status uploading';
    status.textContent = '↑';
    thumb.appendChild(status);
    document.getElementById('thumb-row').appendChild(thumb);
    document.getElementById('thumb-row').scrollLeft = 999999;
    return { thumb, status };
  }

  async function capture() {
    if (count >= MAX_PHOTOS || !stream) return;
    /* Sin candado entre fotos (25/09/2026, el dueño: quiere poder tomar
       fotos seguidas). Cada toque toma SU foto al instante; ya no se
       duplican porque cada una lleva su propio photoKey (camera-queue
       v1.70.0) y el servidor la guarda con ese nombre. Solo se apaga
       al llegar al maximo. */
    const btn = document.getElementById('shutter-btn');

    count++;
    document.getElementById('counter-pill').textContent = count + ' / ' + MAX_PHOTOS + ' photos';

    const imageBase64 = captureFrame();
    const { thumb, status } = addThumb(imageBase64);

    try {
      const loc = await getLocationSafe();
      let endpoint, body;
      if (context === 'recurring-photo') {
        endpoint = '/upload-recurring-photo';
        body = {
          recurringServiceId, visitDate, role: tech.role,
          imageBase64, isVideo: false, techId: tech.id,
          latitude: loc ? loc.lat : null, longitude: loc ? loc.lon : null
        };
      } else if (context === 'service-photo') {
        /* Mismo endpoint que ya usa Admin (upload-service-photo.js) --
           no necesita saber quien es el actor, solo orderId/serviceName/
           la imagen. El nombre del archivo mismo dice a que servicio
           pertenece (svc-<ServiceName>-<timestamp>.jpg), sin ninguna
           columna nueva en SharePoint -- get-my-gallery.js ya lee ese
           prefijo para armar la descripcion (mismo mecanismo, calcado
           de Admin). A peticion del dueno, 18/09/2026. */
        endpoint = '/upload-service-photo';
        body = { orderId, serviceName, imageBase64 };
      } else {
        endpoint = '/upload-photo';
        body = {
          orderId, imageBase64, isVideo: false, techId: tech.id,
          latitude: loc ? loc.lat : null, longitude: loc ? loc.lon : null
        };
      }

      /* enqueue() ya guarda la foto en el telefono ANTES de intentar
         subirla (regla de oro: nunca se pierde, pase lo que pase) --
         si el intento inmediato falla (sin señal), el propio onChange
         de abajo la pinta como "esperando señal". */
      const id = await GSCameraQueue.enqueue({
        endpoint: endpoint, body: body, meta: { orderId: orderId, recurringServiceId: recurringServiceId }
      });
      thumbById[id] = { thumb, status };
    } finally {
      if (count >= MAX_PHOTOS) btn.disabled = true;
    }
  }
  document.getElementById('shutter-btn').addEventListener('click', capture);
  document.getElementById('done-btn').addEventListener('click', finish);

  function onQueueChange(pending) {
    const byId = {};
    pending.forEach(p => { byId[p.id] = p; });
    let waitingCount = 0, failedCount = 0;

    Object.keys(thumbById).forEach(idStr => {
      const id = Number(idStr);
      const entry = thumbById[id];
      const item = byId[id];
      if (item) {
        if (item.failed) {
          entry.status.className = 'thumb-status failed';
          entry.status.textContent = '!';
          entry.status.onclick = () => GSCameraQueue.retryNow(id);
          failedCount++;
        } else {
          entry.status.className = 'thumb-status waiting';
          entry.status.textContent = '⏳';
          waitingCount++;
        }
      } else {
        entry.status.className = 'thumb-status done';
        entry.status.textContent = '✓';
      }
    });

    const statusLine = document.getElementById('status-line');
    if (failedCount) {
      statusLine.textContent = failedCount + ' photo' + (failedCount === 1 ? '' : 's') + ' could not be uploaded — tap it to try again.';
      statusLine.className = 'status-line warn';
    } else if (waitingCount) {
      statusLine.textContent = waitingCount + ' photo' + (waitingCount === 1 ? '' : 's') + ' waiting for signal — will upload automatically.';
      statusLine.className = 'status-line warn';
    } else {
      statusLine.textContent = '';
      statusLine.className = 'status-line';
    }
  }
</script>

</body>
</html>
